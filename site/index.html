<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <title>量化市场驾驶舱</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div>
      <p class="eyebrow">A股量化驾驶舱</p>
      <h1>行情 · 板块 · 信号 · 资讯</h1>
      <p id="updated" class="muted">正在读取数据…</p>
    </div>
    <span class="status"><i></i> 自动更新</span>
  </header>
  <nav class="tabs">
    <a href="#market">大盘</a><a href="#sectors">板块</a>
    <a href="#signals">量化</a><a href="#news">快讯</a>
  </nav>
  <main>
    <section id="market">
      <div class="section-title"><div><p class="eyebrow">MARKET</p><h2>国内外指数</h2></div><span class="muted">预览数据</span></div>
      <div id="indices" class="indices"></div>
      <div class="summary">
        <div><span>A股上涨</span><strong id="up-count">—</strong></div>
        <div><span>A股下跌</span><strong id="down-count">—</strong></div>
        <div><span>买入观察</span><strong id="buy-count">—</strong></div>
      </div>
    </section>
    <section id="sectors">
      <div class="section-title"><div><p class="eyebrow">SECTORS</p><h2>行业板块</h2></div><span class="muted">涨跌幅排行</span></div>
      <div class="sector-layout">
        <div><h3>领涨板块</h3><div id="sector-up" class="sector-list"></div></div>
        <div><h3>领跌板块</h3><div id="sector-down" class="sector-list"></div></div>
      </div>
    </section>
    <section id="signals">
      <div class="section-title"><div><p class="eyebrow">QUANT</p><h2>量化机会</h2></div><span class="muted">趋势 · 动量 · 量价 · 风险</span></div>
      <div class="toolbar">
        <div class="search-wrap">
          <input id="search" type="search" placeholder="输入名称前一两个字或代码" aria-label="搜索代码或名称" autocomplete="off">
          <div id="suggestions" class="suggestions" hidden></div>
        </div>
        <select id="filter" aria-label="筛选信号">
          <option value="all">全部信号</option><option value="buy">买入观察</option>
          <option value="hold">持有等待</option><option value="avoid">谨慎回避</option>
        </select>
      </div>
      <div id="cards" class="cards"></div>
      <p id="empty" class="empty" hidden>没有匹配的标的</p>
    </section>
    <section id="news">
      <div class="section-title"><div><p class="eyebrow">NEWS</p><h2>国内外财经快讯</h2></div><span class="muted">标题 · 来源 · 原文</span></div>
      <div id="news-list" class="news-list"></div>
    </section>
  </main>
  <footer><p>当前为界面预览，数值不是实时行情。正式版接入云端公开数据源。</p><p>仅供研究和辅助决策，不构成投资建议。</p></footer>
  <template id="card-template">
    <article class="card">
      <div class="card-head"><div><p class="code"></p><h2 class="name"></h2></div><div class="score-ring"><strong class="score"></strong><small>评分</small></div></div>
      <div class="signal-row"><span class="signal"></span><span class="risk"></span></div>
      <div class="action-box"><span>量化结论</span><strong class="action"></strong></div>
      <div class="price-grid">
        <div><span>最新价</span><strong class="price"></strong></div><div><span>买入区间</span><strong class="buy-range"></strong></div>
        <div><span>止损参考</span><strong class="stop"></strong></div><div><span>目标参考</span><strong class="target"></strong></div>
      </div>
      <details><summary>查看评分依据</summary><ul class="reasons"></ul></details>
    </article>
  </template>
  <script src="./app.js?v=4" defer></script>
</body>
</html>
