name: 更新量化行情

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0,2,4,6,8,10,12 * * 1-5"
      timezone: "Asia/Shanghai"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-data.txt
      - run: python scripts/build_static_data.py
      - name: 保存最新行情
        run: |
          git config user.name "quant-update-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json
          git diff --cached --quiet || git commit -m "data: update market signals"
          git push
